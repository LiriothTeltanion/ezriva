[project]
name = "ezriva"
version = "0.1.0"
description = "A human-controlled multilingual family navigation agent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Kevin Cusnir" }]
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "tzdata==2026.3",
  "uvicorn==0.52.1",
]

[dependency-groups]
dev = [
  "detect-secrets==1.5.0",
  "httpx==0.28.1",
  "mypy==1.20.2",
  "pytest==9.1.1",
  "ruff==0.16.2",
]

[tool.uv]
package = false
required-version = "==0.11.33"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
pythonpath = ["apps/api/src"]
testpaths = ["apps/api/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ANN", "B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"apps/api/tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["ezriva"]

[tool.mypy]
python_version = "3.12"
mypy_path = "apps/api/src"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_configs = true
exclude = ["node_modules", "apps/web/dist"]
